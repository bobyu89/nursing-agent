name = "shiftguard-linebot"
main = "worker.mjs"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PLATFORM_URL = "https://bobyu89.github.io/nursing-agent/"
# LIFF（選配）：在 LINE Developers 建立 LINE Login channel → LIFF 分頁新增 app
# （Endpoint URL 填上方 PLATFORM_URL + index.html、Size 選 Full），把 LIFF ID 貼進來
# 後重新 deploy——「開啟平台／完整儀表板」按鈕即改以全高視窗在 LINE 內開啟。
LIFF_ID = "2011209447-AlMMDUMl"
# 圖文選單依權責層掛載（Phase 1.5，docs/LINEBOT-STAGE1.md §2.4）：跑 richmenu.ps1 後把印出的三個 id 貼進來。
# 未設定＝不掛（全體沿用預設選單），不影響任何流程。
# RICHMENU_STAFF = "richmenu-…"
# RICHMENU_HEAD  = "richmenu-…"
# RICHMENU_EXEC  = "richmenu-…"

# 機密（不放這裡，部署後用指令設定）：
#   npx wrangler secret put LINE_CHANNEL_SECRET
#   npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN

# ── Stage 1 地基（docs/LINEBOT-STAGE1.md §2）──────────────────────
# D1：狀態儲存（身分綁定、班表快照、預班／替班狀態機、留痕鏈）。
# 整塊註解時 bot 以「無狀態示範模式」運作（與 Stage 0 行為相同，綁定等指令會告知未啟用）。
# 啟用三步：
#   1. npx wrangler d1 create shiftguard         → 複製輸出的 database_id
#   2. 把下面三行取消註解、貼上 database_id
#   3. npx wrangler d1 execute shiftguard --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "shiftguard"
database_id = "8bbd38d4-5bb9-4857-84dd-c3c75c76d7e5"   # 2026-09-19 建於 APAC

# Cron：每分鐘掃一次逾時（Phase 0 只清過期綁定碼；Phase 1 起掃替班逾時、Phase 2 催繳）。
# 無 D1 時 scheduled() 直接返回，不耗任何資源。
[triggers]
crons = ["* * * * *"]
