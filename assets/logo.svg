       輪班是為了守護彼此，公平是讓沒有人一直站在風口。白肚刻意作盾形，呼應「守」。
       設計約束（ip-as-logo）：≤7 個基本形狀、圓潤無銳角、三色語義（靛藍/米白/琥珀）。 -->
