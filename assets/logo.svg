<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="班守 ShiftGuard">
  <!-- 班守 IP「守守」：北極熊。極夜最長可達大半年——牠就在那樣的夜裡守著；
       一身白，像極了白袍。夜再深，也要有人守著班表與彼此。
       設計約束（ip-as-logo）：基本形狀、圓潤無銳角、米白／暖灰／墨藍三色語義。 -->
