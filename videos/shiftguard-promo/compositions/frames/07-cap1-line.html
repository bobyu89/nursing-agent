      var BLINK = [
        [0.38, 1], [0.68, 0], [0.98, 1], [1.28, 0],
        [1.58, 1], [1.88, 0], [2.18, 1], [2.48, 0],
        [2.66, 1], [2.75, 0]
      ];
      BLINK.forEach(function (b) {
        tl.to("#f07-cursor", { opacity: b[1], duration: 0.001, ease: "none" }, b[0]);
      });

      /* send beat — tiny pulse from the bubble corner */
      tl.to("#f07-user", { scale: 1.03, duration: 0.09, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.78);

      /* ============ Phase A2 (2.9–5.9s) — dots, then ack card rows light up ============ */
      /* VO: 「系統聽懂」 */

      tl.fromTo("#f07-avatar", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 2.9);
      tl.fromTo("#f07-dots", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, 2.9);
      var dots = gsap.utils.toArray(".f07-dot");
      dots.forEach(function (d, i) {
        tl.to(d, { y: -5, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.0 + i * 0.08);
      });
      /* the pulse dies the instant the result lands */
      tl.to("#f07-dots", { scale: 0.85, opacity: 0, duration: 0.16, ease: "power2.in" }, 3.54);

      tl.fromTo(
        "#f07-ack",
        { scale: 0.92, y: 10, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.6
      );

      /* rows light up one by one — arrival + accent-tint flash that fades */
      var arows = gsap.utils.toArray(".f07-arow");
      var abars = gsap.utils.toArray(".f07-abar");
      var ROW_AT = [4.2, 4.8, 5.4];
      arows.forEach(function (row, i) {
        tl.fromTo(row.querySelector(".f07-atext"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, ROW_AT[i]);
        tl.fromTo(abars[i], { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.22, ease: "power2.out" }, ROW_AT[i]);
        tl.to(abars[i], { opacity: 0, duration: 0.5, ease: "power2.out" }, ROW_AT[i] + 0.55);
      });

      /* ============ Phase B (6.4–10.4s) — suggestion card + camera payoff ============ */
      /* VO: 「合格的替補前三名，直接送回來」 — message pop at 6.4 local */

      tl.fromTo(
        "#f07-sug",
        { scale: 0.9, y: 18, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        6.4
      );
      var srows = gsap.utils.toArray(".f07-srow");
      srows.forEach(function (row, i) {
        tl.fromTo(row, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.78 + i * 0.24);
      });

      /* ONE camera move — payoff push-in toward the suggestion card, then a slow
         micro-drift that runs to the final frame */
      tl.fromTo("#f07-camzoom", { scale: 1 }, { scale: 1.05, duration: 2.0, ease: "power2.inOut" }, 6.4);
      tl.to("#f07-camzoom", { scale: 1.062, duration: 6.9, ease: "none" }, 8.4);

      /* kinetic-beat-slam 字卡 — scale + blur slam, the「3」carries the accent */
      tl.fromTo(
        "#f07-kicker",
        { scale: 1.45, opacity: 0, filter: "blur(14px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out" },
        8.6
      );
      tl.fromTo("#f07-under", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 9.15);

      /* late beat — chips count off 1·2·3 on VO「一個一個」 */
      var chips = gsap.utils.toArray(".f07-chip");
      chips.forEach(function (c, i) {
        tl.to(c, { scale: 1.16, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, 9.5 + i * 0.22);
      });

      /* ============ Phase C (11.0–15.0s) — quick-reply follow-up, the bot asks back ============ */
      /* VO: 「沒講清楚的條件，它會用按鈕追問，不臆測。」 */

      tl.fromTo("#f07-qhint", { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 11.3);
      gsap.utils.toArray(".f07-qrpill").forEach(function (p, i) {
        tl.fromTo(
          p,
          { scale: 0.6, y: 10, opacity: 0 },
          { scale: 1, y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          12.2 + i * 0.25
        );
      });
      /* 「不臆測」 — the pills wait for an answer (offered, never pressed): one soft pulse each */
      gsap.utils.toArray(".f07-qrpill").forEach(function (p, i) {
        tl.to(p, { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, 13.9 + i * 0.18);
      });
    })();
  </script>
</template>
