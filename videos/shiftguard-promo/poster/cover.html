<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>班守 ShiftGuard — 影片封面</title>
<style>
  html, body { margin: 0; padding: 0; }
  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #101b30;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  /* 極淡班表格線（同冷開場氛圍） */
  .gv, .gh { position: absolute; background: rgba(154, 168, 194, 0.10); }
  .gv { top: 180px; width: 1px; height: 660px; }
  .gh { left: 220px; width: 1480px; height: 1px; }

  /* 字標（左上） */
  #brand {
    position: absolute;
    left: 120px;
    top: 96px;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #f3f5fa;
  }
  #brand .en { color: #9aa8c2; font-weight: 700; margin-left: 18px; letter-spacing: 0.02em; }
  #brand-bar {
    position: absolute;
    left: 122px;
    top: 168px;
    width: 96px;
    height: 8px;
    border-radius: 4px;
    background: #4060ef;
  }

  /* 核心句（主角） */
  #hero {
    position: absolute;
    left: 120px;
    top: 380px;
    color: #f3f5fa;
    font-size: 150px;
    font-weight: 800;
    line-height: 1.32;
    letter-spacing: 0.02em;
  }
  .kw { position: relative; display: inline-block; }
  .kwbar {
    position: absolute;
    inset: 0.10em -0.06em 0.04em;
    background: #4060ef;
    border-radius: 10px;
    transform: skewX(-2deg);
  }
  .kwtext { position: relative; }

  /* 副標 */
  #sub {
    position: absolute;
    left: 126px;
    top: 856px;
    font-size: 36px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: #9aa8c2;
  }
  #sub .dot { margin: 0 18px; opacity: 0.5; }

  /* 守守（右下，白圓框） */
  #mascot {
    position: absolute;
    right: 110px;
    bottom: 92px;
    width: 148px;
    height: 148px;
    padding: 14px;
    box-sizing: border-box;
    background: #ffffff;
    border: 1px solid #e4e9f1;
    border-radius: 50%;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  #mascot svg { display: block; width: 100%; height: 100%; }

  /* 右上：時長膠囊 */
  #pill {
    position: absolute;
    right: 120px;
    top: 104px;
    height: 56px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(243, 245, 250, 0.06);
    border: 1px solid rgba(228, 233, 241, 0.22);
    border-radius: 999px;
    color: #d7deeb;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  #pill .tri {
    width: 0; height: 0;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-left: 14px solid #d7deeb;
  }
</style>
</head>
<body>
<div id="stage">
  <span class="gv" style="left:220px"></span><span class="gv" style="left:390px"></span>
  <span class="gv" style="left:560px"></span><span class="gv" style="left:730px"></span>
  <span class="gv" style="left:900px"></span><span class="gv" style="left:1070px"></span>
  <span class="gv" style="left:1240px"></span><span class="gv" style="left:1410px"></span>
  <span class="gv" style="left:1580px"></span><span class="gv" style="left:1700px"></span>
  <span class="gh" style="top:180px"></span><span class="gh" style="top:345px"></span>
  <span class="gh" style="top:510px"></span><span class="gh" style="top:675px"></span>
  <span class="gh" style="top:840px"></span>

  <div id="brand">班守<span class="en">ShiftGuard</span></div>
  <div id="brand-bar"></div>

  <div id="pill"><span class="tri"></span>產品影片・97 秒</div>

  <div id="hero">
    班表照顧好，<br />
    人就<span class="kw"><span class="kwbar"></span><span class="kwtext">留得住</span></span>
  </div>

  <div id="sub">護理排班治理平台<span class="dot">・</span>缺班秒解<span class="dot">・</span>換班合規<span class="dot">・</span>留任看得見</div>

  <div id="mascot" aria-label="守守">
    <svg viewBox="0 0 64 64">
      <defs>
        <radialGradient id="cv-fur" cx="50%" cy="26%" r="90%">
          <stop offset="0%" stop-color="#fffdf6"/>
          <stop offset="100%" stop-color="#f3ecdb"/>
        </radialGradient>
      </defs>
      <circle cx="14.5" cy="15" r="9.2" fill="url(#cv-fur)"/>
      <circle cx="49.5" cy="15" r="9.2" fill="url(#cv-fur)"/>
      <circle cx="15.5" cy="16" r="4.8" fill="#d9d4c8"/>
      <circle cx="48.5" cy="16" r="4.8" fill="#d9d4c8"/>
      <path d="M32 9 C48.5 9 58 22 58 38 C58 53 47 61.5 32 61.5 C17 61.5 6 53 6 38 C6 22 15.5 9 32 9 Z" fill="url(#cv-fur)"/>
      <ellipse cx="32" cy="45" rx="11.5" ry="9" fill="#e6e1d4"/>
      <circle cx="22.5" cy="33.5" r="2.9" fill="#16233a"/>
      <circle cx="41.5" cy="33.5" r="2.9" fill="#16233a"/>
      <circle cx="23.5" cy="32.5" r="1" fill="#ffffff"/>
      <circle cx="42.5" cy="32.5" r="1" fill="#ffffff"/>
      <rect x="27.4" y="39.2" width="9.2" height="5.6" rx="2.8" fill="#16233a"/>
      <path d="M28.5 49.5 Q32 52.5 35.5 49.5" fill="none" stroke="#16233a" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>
</div>
</body>
</html>
