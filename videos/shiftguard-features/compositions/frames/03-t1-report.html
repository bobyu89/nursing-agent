        { t: 2.5, text: "我明天小夜沒辦法上班" }
      ];

        tl.to(typedEl, { textContent: s.text, duration: 0.001, ease: "none" }, s.t);

      var BLINK = [

        tl.to("#f03-cursorbar", { opacity: b[1], duration: 0.001, ease: "none" }, b[0]);

      tl.to("#f03-dots", { scale: 0.85, opacity: 0, duration: 0.16, ease: "power2.in" }, 4.42);

        tl.fromTo(

          { scale: 0.6, y: 10, opacity: 0 },
          { scale: 1, y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          7.7 + i * 0.2

      });

      /* cursor-click-ripple: move → press (cursor+target depress together) → single ring */
      tl.fromTo("#f03-pointer", { x: 560, y: 720, opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 8.3);
      tl.to("#f03-pointer", { x: 254, y: 668, duration: 0.85, ease: "power2.inOut" }, 8.35);
      tl.to("#f03-pointer", { scale: 0.85, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, 9.35);
