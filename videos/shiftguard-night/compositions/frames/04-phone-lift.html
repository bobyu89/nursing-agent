<template>
  <div id="f04-root" data-composition-id="04-phone-lift" data-duration="5" data-width="1920" data-height="1080">
    <div class="clip" id="f04-clip" data-start="0" data-duration="5" data-track-index="0">
      <div class="p stage" id="f04-stage"></div>
      <div class="sub" id="f04-sub">每次開口，都要先想過一輪。</div>
    </div>

    <script src="assets/pixel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var PX = window.PX, N = PX.pal.night, BODY = PX.pal.body;
        var stage = document.getElementById("f04-stage");

        PX.rect(stage, 0, 0, 160, 90, "#0d1729");
        PX.rect(stage, 0, 66, 160, 24, "#16223c");     /* 桌面 */
        PX.rect(stage, 0, 66, 160, 1, N.counterT);

        /* 手握手機，拇指懸在螢幕上方沒按下去 */
        var hand = PX.layer(stage, "f04-hand");
        PX.sprite(hand, PX.spr.handPhone, BODY, 52, 18, 3);

        /* 螢幕的光打上來 */
        var glow = PX.layer(stage, "f04-glow", 1);
        PX.rect(glow, 62, 18, 36, 3, N.phoneOn, 0.16);
        PX.rect(glow, 58, 15, 44, 3, N.phoneOn, 0.1);
        PX.rect(glow, 54, 12, 52, 3, N.phoneOn, 0.06);
        PX.rect(glow, 50, 9, 60, 3, N.phoneOn, 0.035);

        PX.scene.vignette(stage, N, 0.5);

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* 手抬起來一格，然後停住——猶豫就是停住 */
        tl.set("#f04-hand", { y: -PX.U }, 0.55);
        tl.set("#f04-hand", { y: -2 * PX.U }, 0.95);

        /* 螢幕光跟著呼吸，畫面唯一的動作 */
        tl.to("#f04-glow", { opacity: 0.72, duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true }, 0.4);

        tl.fromTo("#f04-sub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.25);
        tl.to("#f04-sub", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.5);

        window.__timelines["04-phone-lift"] = tl;
      })();
    </script>
  </div>
</template>
