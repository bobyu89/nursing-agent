<template>
  <div id="f13-root" data-composition-id="13-dots-three" data-duration="6.3" data-width="1920" data-height="1080">
    <div class="clip" id="f13-clip" data-start="0" data-duration="6.3" data-track-index="0">
      <div class="p stage" id="f13-stage"></div>
      <div class="sub" id="f13-sub">只是這套算法，一直沒有離開過她的腦袋。</div>
    </div>

    <script src="assets/pixel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var PX = window.PX, N = PX.pal.night;
        var stage = document.getElementById("f13-stage");

        PX.rect(stage, 0, 0, 160, 90, "#080d18");

        /* 熄掉的 21 個留在原位當殘影——被排除的人沒有消失 */
        PX.scene.dotGrid(stage, {
          cols: 8, rows: 3, x0: 33, y0: 33, gap: 13, size: 3,
          color: N.accentLit, opacity: 0.06, idPrefix: "f13-ghost"
        });

        /* 活下來的三個：從光點長成分數條。對應 S1–S5 軟評分排序。 */
        var rows = [
          { y: 32, w: 46, id: "f13-b1", dot: "f13-p1", top: true },
          { y: 44, w: 39, id: "f13-b2", dot: "f13-p2", top: false },
          { y: 56, w: 30, id: "f13-b3", dot: "f13-p3", top: false }
        ];
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          PX.rect(stage, 44, r.y, 72, 3, N.accentLit, 0.1);
          var bar = PX.rect(stage, 44, r.y, r.w, 3, r.top ? "#8fa4ff" : N.accent, 1, r.id);
          bar.style.transformOrigin = "left center";
          PX.rect(stage, 38, r.y, 3, 3, r.top ? "#8fa4ff" : N.accentLit, 1, r.dot);
        }

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* 光點先就位，再長出分數條 */
        for (var j = 1; j <= 3; j++) {
          tl.set("#f13-b" + j, { scaleX: 0 }, 0);
          tl.fromTo("#f13-p" + j, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0.3 + (j - 1) * 0.22);
          tl.to("#f13-b" + j, { scaleX: 1, duration: 0.85, ease: "power3.out" }, 1.1 + (j - 1) * 0.28);
        }

        /* 第一名再亮一階——這就是「為什麼是他」 */
        tl.to("#f13-b1", { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.4);
        tl.to("#f13-b2", { opacity: 0.55, duration: 0.5, ease: "power2.out" }, 3.4);
        tl.to("#f13-b3", { opacity: 0.4, duration: 0.5, ease: "power2.out" }, 3.4);

        tl.fromTo("#f13-sub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.15);
        tl.to("#f13-sub", { opacity: 0, duration: 0.35, ease: "power2.in" }, 5.55);

        window.__timelines["13-dots-three"] = tl;
      })();
    </script>
  </div>
</template>
