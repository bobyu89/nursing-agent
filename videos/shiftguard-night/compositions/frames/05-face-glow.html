<template>
  <div id="f05-root" data-composition-id="05-face-glow" data-duration="7.4" data-width="1920" data-height="1080">
    <div class="clip" id="f05-clip" data-start="0" data-duration="7.4" data-track-index="0">
      <div class="p stage" id="f05-stage"></div>
      <div class="sub" id="f05-sub">誰昨天上大夜？誰這個月已經加了二十小時？</div>
    </div>

    <script src="assets/pixel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var PX = window.PX, N = PX.pal.night, LIT = PX.pal.bodyLit;
        var stage = document.getElementById("f05-stage");

        PX.rect(stage, 0, 0, 160, 90, "#080d18");

        /* 臉部特寫：只取 sprite 的頭部，放大三倍。
           手機光從下往上打，所以整張臉走冷色調色盤。 */
        var head = PX.spr.nurseFront.slice(0, 17);
        var headBlink = PX.spr.nurseFrontBlink.slice(0, 17);

        var g = PX.layer(stage, "f05-head");
        var open = PX.layer(stage, "f05-open", 1);
        var blink = PX.layer(stage, "f05-blink", 0);
        g.appendChild(open); g.appendChild(blink);
        PX.sprite(open, head, LIT, 44, 8, 3);
        PX.sprite(blink, headBlink, LIT, 44, 8, 3);

        /* 光源本身壓在畫面最下緣、切出去一半——
           不能佔到字幕的位置，那是字的地盤。 */
        PX.rect(stage, 62, 85, 36, 5, "#0d1526");
        PX.rect(stage, 64, 86, 32, 4, N.phoneOn, 0.62, "f05-screen");

        /* 光往上打，越遠越淡 */
        var up = PX.layer(stage, "f05-up", 1);
        PX.rect(up, 58, 78, 44, 7, N.phoneOn, 0.1);
        PX.rect(up, 54, 70, 52, 8, N.phoneOn, 0.07);
        PX.rect(up, 50, 61, 60, 9, N.phoneOn, 0.045);
        PX.rect(up, 46, 51, 68, 10, N.phoneOn, 0.028);

        /* 上半部壓暗——光打不到的地方 */
        PX.rect(stage, 0, 0, 160, 26, "#050810", 0.5);
        PX.scene.vignette(stage, N, 0.6);

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* 眨眼三次，比別鏡慢——她在想事情 */
        var blinks = [1.5, 3.9, 6.2];
        for (var b = 0; b < blinks.length; b++) {
          tl.set("#f05-blink", { opacity: 1 }, blinks[b]);
          tl.set("#f05-open", { opacity: 0 }, blinks[b]);
          tl.set("#f05-blink", { opacity: 0 }, blinks[b] + 0.14);
          tl.set("#f05-open", { opacity: 1 }, blinks[b] + 0.14);
        }

        /* 頭極慢地低下一格 */
        tl.set("#f05-head", { y: PX.U }, 4.6);

        /* 螢幕光微微起伏 */
        tl.to("#f05-up", { opacity: 0.8, duration: 2.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 0);

        tl.fromTo("#f05-sub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.25);
        tl.to("#f05-sub", { opacity: 0, duration: 0.35, ease: "power2.in" }, 6.85);

        window.__timelines["05-face-glow"] = tl;
      })();
    </script>
  </div>
</template>
