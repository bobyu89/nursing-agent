<template>
  <div id="f11-root" data-composition-id="11-dots-form" data-duration="3.6" data-width="1920" data-height="1080">
    <div class="clip" id="f11-clip" data-start="0" data-duration="3.6" data-track-index="0">
      <div class="p stage" id="f11-stage"></div>
      <div class="sub" id="f11-sub">她腦中一直在算。</div>
    </div>

    <script src="assets/pixel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var PX = window.PX, N = PX.pal.night;
        var stage = document.getElementById("f11-stage");

        PX.rect(stage, 0, 0, 160, 90, "#080d18");

        /* 24 個光點 = 24 位可調度人力。對應 rules.js 的候選池。 */
        PX.scene.dotGrid(stage, {
          cols: 8, rows: 3, x0: 33, y0: 33, gap: 13, size: 3,
          color: N.accentLit, opacity: 0, idPrefix: "f11-d"
        });

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* 從暗中浮出，排成整齊的網格。
           順序寫死——不能有亂數，render 才能重現。 */
        var order = [11, 3, 18, 7, 22, 0, 14, 9, 20, 5, 16, 1,
                     12, 23, 6, 17, 2, 10, 21, 8, 19, 4, 15, 13];
        for (var i = 0; i < order.length; i++) {
          tl.fromTo("#f11-d" + order[i],
            { opacity: 0, scale: 0.4 },
            { opacity: 0.85, scale: 1, duration: 0.42, ease: "power2.out" },
            0.25 + i * 0.075);
        }

        tl.fromTo("#f11-sub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.25);
        tl.to("#f11-sub", { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.2);

        window.__timelines["11-dots-form"] = tl;
      })();
    </script>
  </div>
</template>
