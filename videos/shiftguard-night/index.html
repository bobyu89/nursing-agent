<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>深夜的班表 — 班守 ShiftGuard</title>
    <script src="assets/pixel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Sans TC"; src: local("Noto Sans TC"); }
      @font-face { font-family: "Microsoft JhengHei"; src: local("Microsoft JhengHei"); }
      @font-face { font-family: "PingFang TC"; src: local("PingFang TC"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px;
        overflow: hidden;
        background: #080d18;
      }
      #root {
        position: relative;
        width: 1920px; height: 1080px;
        overflow: hidden;
        background: #080d18;
        font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      }
      [data-composition-id="root"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      .clip { position: absolute; inset: 0; }
      .p { position: absolute; }
      .stage { left: 0; top: 0; width: 1920px; height: 1080px; }

      /* ── 字幕層 ─────────────────────────────────────────
         全片的中文都在這一層，用真字型渲染。
         像素畫面裡一個字都沒有——這是全片的規則。 */
      .sub {
        position: absolute;
        left: 50%; bottom: 92px;
        transform: translateX(-50%);
        width: 1500px;
        text-align: center;
        font-size: 54px;
        font-weight: 700;
        line-height: 1.5;
        color: #ffffff;
        text-shadow: 0 3px 22px rgba(4,7,14,.96), 0 1px 3px rgba(4,7,14,.92);
      }
      .hud {
        position: absolute;
        right: 108px; top: 96px;
        font-size: 40px;
        font-weight: 500;
        color: #f3f5fa;
        letter-spacing: .08em;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 14px rgba(4,7,14,.92);
        text-align: right;
      }
      .hud .small {
        display: block;
        font-size: 24px;
        color: #b3c1d8;
        letter-spacing: .16em;
        margin-top: 10px;
      }
      #blackout { position: absolute; inset: 0; background: #080d18; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="root"
      data-start="0"
      data-duration="86.4"
      data-width="1920"
      data-height="1080"
    >
      <!-- ── 幕一 · 靜 ────────────────────────────────── -->
      <div id="el-f01" data-composition-id="01-corridor" data-composition-src="compositions/frames/01-corridor.html"

      <div class="clip" id="blackout-clip" data-start="0" data-duration="86.4" data-track-index="9">
        <div id="blackout"></div>
      </div>

      <audio id="a02" src="assets/voice/v02.wav" data-start="5.5"  data-duration="2.84" data-track-index="10" data-audio-group="voiceover"></audio>

    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var D = 86.4;

        /* 總表只管三件事：開場淡入、幕與幕之間的呼吸、收尾淡出。
           每一鏡的內部節奏由該鏡自己的 timeline 負責。 */
        tl.fromTo("#blackout", { opacity: 1 }, { opacity: 0, duration: 1.3, ease: "power2.out" }, 0);

        /* 幕三結束 → 幕四：從寫實切到抽象，這裡需要一次真正的黑 */
        tl.to("#blackout", { opacity: 1, duration: 0.45, ease: "power2.in" }, 49.45);
        tl.to("#blackout", { opacity: 0, duration: 0.6, ease: "power2.out" }, 49.9);

        /* 幕四結束 → 幕五：從抽象回到空間，再黑一次 */
        tl.to("#blackout", { opacity: 1, duration: 0.4, ease: "power2.in" }, 67.0);
        tl.to("#blackout", { opacity: 0, duration: 0.55, ease: "power2.out" }, 67.4);

        tl.to("#blackout", { opacity: 1, duration: 1.0, ease: "power2.in" }, D - 1.0);

        window.__timelines["root"] = tl;
      })();
    </script>
  </body>
</html>
